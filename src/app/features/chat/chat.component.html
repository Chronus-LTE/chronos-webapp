<div class="chat-container">
  <!-- Sidebar -->
  <aside class="chat-sidebar">
    <div class="sidebar-header">
      <button class="btn-new-chat" (click)="startNewChat()">
        <i class="fas fa-plus"></i>
        <span>New chat</span>
      </button>
    </div>

    <div class="sidebar-content">
      <div class="chat-history">
        <h3 class="history-title">Recent</h3>
        <div class="history-list">
          <button *ngFor="let chat of chatHistory" class="history-item" [class.active]="chat.id === currentChatId"
            (click)="loadChat(chat.id)">
            <i class="fas fa-message"></i>
            <span class="history-item-title">{{ chat.title }}</span>
            <button class="btn-delete" (click)="deleteChat(chat.id, $event)">
              <i class="fas fa-trash"></i>
            </button>
          </button>
        </div>
      </div>
    </div>
  </aside>

  <!-- Main Chat Area -->
  <main class="chat-main">
    <!-- Welcome Screen (shown when no messages) -->
    <div class="welcome-screen" *ngIf="!isChatStarted">
      <div class="welcome-content">
        <div class="welcome-header">
          <div class="logo-large">
            <i class="fas fa-robot"></i>
          </div>
          <h1 class="welcome-title">Your Personal AI Assistant</h1>
          <p class="welcome-subtitle">Your intelligent companion for productivity, learning, and growth</p>
        </div>

        <div class="suggestions-grid">
          <button *ngFor="let suggestion of suggestions" class="suggestion-card"
            (click)="useSuggestion(suggestion.prompt)">
            <div class="suggestion-icon">
              <i [class]="suggestion.icon"></i>
            </div>
            <h3 class="suggestion-title">{{ suggestion.title }}</h3>
            <p class="suggestion-description">{{ suggestion.description }}</p>
          </button>
        </div>
      </div>
    </div>

    <!-- Chat Screen (shown when chat started) -->
    <div class="chat-screen" *ngIf="isChatStarted">
      <!-- Messages Container -->
      <div class="messages-container" #messagesContainer>
        <div class="messages">
          <div *ngFor="let message of messages" class="message" [class.user-message]="message.sender === 'user'"
            [class.assistant-message]="message.sender === 'assistant'">
            <div class="message-avatar" *ngIf="message.sender === 'assistant'">
              <i class="fas fa-robot"></i>
            </div>
            <div class="message-content">
              <div class="message-bubble">
                {{ message.content }}
              </div>
            </div>
          </div>

          <div *ngIf="isLoading" class="message assistant-message">
            <div class="message-avatar">
              <i class="fas fa-robot"></i>
            </div>
            <div class="message-content">
              <div class="message-bubble typing-indicator">
                <span></span>
                <span></span>
                <span></span>
              </div>
            </div>
          </div>
        </div>
      </div>
    </div>

    <!-- Input Area (always visible) -->
    <footer class="chat-input-area">
      <div class="input-container">
        <form class="chat-input-form" (ngSubmit)="sendMessage()">
          <div class="input-wrapper">
            <textarea #messageInput class="chat-input" [(ngModel)]="userMessage" name="message"
              [placeholder]="isChatStarted ? 'Type your message...' : 'Ask me anything...'"
              (keydown.enter)="handleEnterKey($event)" [disabled]="isLoading" rows="1">>
            </textarea>
            <button type="submit" class="btn-send" [disabled]="!userMessage.trim() || isLoading"
              [class.active]="userMessage.trim()">
              <i class="fas fa-arrow-up"></i>
            </button>
          </div>
        </form>
        <p class="input-hint">Chronus is your personal AI assistant. Always verify important information independently.</p>
      </div>
    </footer>
  </main>
</div>
