<div class="auth-container">
    <a routerLink="/" class="btn-back">
        <i class="fas fa-arrow-left"></i>
        <span>Back to Home</span>
    </a>
    <div class="auth-card">
        <div class="auth-header">
            <h1 class="auth-title">Welcome back</h1>
            <p class="auth-subtitle">Enter your details to access your account</p>
        </div>

        <button type="button" class="btn-google" (click)="loginWithGoogle()">
            <img src="https://www.gstatic.com/firebasejs/ui/2.0.0/images/auth/google.svg" alt="Google logo">
            <span>Continue with Google</span>
        </button>

        <div class="divider">
            <span>or</span>
        </div>

        <form [formGroup]="loginForm" (ngSubmit)="onSubmit()" class="auth-form">
            <div class="form-group">
                <label for="email">Email</label>
                <input type="email" id="email" formControlName="email" placeholder="name@example.com"
                    [class.has-error]="loginForm.get('email')?.invalid && loginForm.get('email')?.touched">
                <div class="error-message" *ngIf="loginForm.get('email')?.invalid && loginForm.get('email')?.touched">
                    <span *ngIf="loginForm.get('email')?.errors?.['required']">Email is required</span>
                    <span *ngIf="loginForm.get('email')?.errors?.['email']">Please enter a valid email</span>
                </div>
            </div>

            <div class="form-group">
                <label for="password">Password</label>
                <input type="password" id="password" formControlName="password" placeholder="Enter your password"
                    [class.has-error]="loginForm.get('password')?.invalid && loginForm.get('password')?.touched">
                <div class="error-message"
                    *ngIf="loginForm.get('password')?.invalid && loginForm.get('password')?.touched">
                    Password is required
                </div>
            </div>

            <div class="form-actions">
                <a routerLink="/auth/forgot-password" class="forgot-password">Forgot password?</a>
            </div>

            <button type="submit" class="btn-submit" [disabled]="loginForm.invalid || isLoading">
                <span *ngIf="!isLoading">Sign in</span>
                <span *ngIf="isLoading" class="spinner"></span>
            </button>
        </form>

        <div class="auth-footer">
            <p>Don't have an account? <a routerLink="/auth/register">Sign up</a></p>
        </div>
    </div>
</div>
