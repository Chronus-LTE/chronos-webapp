<aside class="sidebar" [class.collapsed]="collapsed">
    <!-- Header with Logo and Toggle -->
    <div class="sidebar-header">
        <div class="logo-container" (click)="navigate('/chat')">
            <img src="assets/logo/chronus-logo-symbol.png" class="logo-icon">
        </div>
    </div>

    <!-- Navigation Items -->
    <nav class="sidebar-nav">
        <div class="nav-section">
            <button *ngFor="let item of navItems" class="nav-item" [class.active]="isActive(item.route)"
                (click)="navigate(item.route)" [attr.aria-label]="item.label" [ngbTooltip]="item.label"
                placement="right" container="body">
                <span class="nav-icon">
                    <!-- Chat Icon -->
                    <svg *ngIf="item.icon === 'chat'" width="20" height="20" viewBox="0 0 24 24" fill="none"
                        stroke="currentColor" stroke-width="2">
                        <path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"></path>
                    </svg>

                    <!-- Mail Icon -->
                    <svg *ngIf="item.icon === 'mail'" width="20" height="20" viewBox="0 0 24 24" fill="none"
                        stroke="currentColor" stroke-width="2">
                        <path d="M4 4h16c1.1 0 2 .9 2 2v12c0 1.1-.9 2-2 2H4c-1.1 0-2-.9-2-2V6c0-1.1.9-2 2-2z"></path>
                        <polyline points="22,6 12,13 2,6"></polyline>
                    </svg>

                    <!-- Calendar Icon -->
                    <svg *ngIf="item.icon === 'calendar'" width="20" height="20" viewBox="0 0 24 24" fill="none"
                        stroke="currentColor" stroke-width="2">
                        <rect x="3" y="4" width="18" height="18" rx="2" ry="2"></rect>
                        <line x1="16" y1="2" x2="16" y2="6"></line>
                        <line x1="8" y1="2" x2="8" y2="6"></line>
                        <line x1="3" y1="10" x2="21" y2="10"></line>
                    </svg>

                    <!-- Library/Knowledge Icon -->
                    <svg *ngIf="item.icon === 'library'" width="20" height="20" viewBox="0 0 24 24" fill="none"
                        stroke="currentColor" stroke-width="2">
                        <path d="M4 19.5A2.5 2.5 0 0 1 6.5 17H20"></path>
                        <path d="M6.5 2H20v20H6.5A2.5 2.5 0 0 1 4 19.5v-15A2.5 2.5 0 0 1 6.5 2z"></path>
                    </svg>
                </span>
                <span class="nav-label" *ngIf="!collapsed">{{ item.label }}</span>
            </button>
        </div>

        <!-- Profile Section -->
        <!-- Profile Section -->
        <div class="nav-section nav-section-bottom">
            <ng-container *ngIf="currentUser$ | async as user; else noUser">
                <div class="profile-container" ngbDropdown placement="top-left" container="body">
                    <button class="nav-item profile-item" ngbDropdownToggle>
                        <div class="nav-icon profile-avatar">
                            <img [src]="getAvatar(user)" alt="User Avatar" class="avatar-img">
                        </div>
                        <span class="nav-label" *ngIf="!collapsed">{{ user.full_name }}</span>
                    </button>
                    <div ngbDropdownMenu class="profile-dropdown">
                        <div class="dropdown-header">
                            <img [src]="getAvatar(user)" alt="User Avatar" class="dropdown-avatar">
                            <div class="dropdown-user-info">
                                <span class="dropdown-name">{{ user.full_name }}</span>
                                <span class="dropdown-email">{{ user.email }}</span>
                            </div>
                        </div>
                        <div class="dropdown-divider"></div>
                        <button ngbDropdownItem (click)="navigate('/profile')">
                            <i class="fas fa-user"></i> Profile
                        </button>
                        <button ngbDropdownItem (click)="navigate('/settings')">
                            <i class="fas fa-cog"></i> Settings
                        </button>
                        <div class="dropdown-divider"></div>
                        <button ngbDropdownItem (click)="logout()" class="text-danger">
                            <i class="fas fa-sign-out-alt"></i> Logout
                        </button>
                    </div>
                </div>
            </ng-container>
            <ng-template #noUser>
                <button class="nav-item profile-item" (click)="navigate('/auth/login')">
                    <div class="nav-icon profile-avatar">
                        <i class="fas fa-user"></i>
                    </div>
                    <span class="nav-label" *ngIf="!collapsed">Login</span>
                </button>
            </ng-template>
        </div>
    </nav>
</aside>
