<div class="modal-header">
    <h5 class="modal-title">Confirm Delete</h5>
    <button type="button" class="btn-close" aria-label="Close" (click)="activeModal.dismiss()"></button>
</div>
<div class="modal-body">
    <p>Are you sure you want to delete this event?</p>
    <div class="event-title-display">{{ eventTitle }}</div>
    <p style="margin-top: 16px; color: var(--sidebar-text-secondary); font-size: 13px;">This action cannot be undone.
    </p>
</div>
<div class="modal-footer">
    <button type="button" class="btn btn-secondary" (click)="activeModal.dismiss()">Cancel</button>
    <button type="button" class="btn btn-danger" (click)="activeModal.close()">Delete Event</button>
</div>
